<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高二家長座談會・互動入口</title>
<style>
:root{--bg:#fff7e6;--ink:#2b2350;--card:#ffffff;--muted:#6b6490;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1735;--ink:#fff4dd;--card:#2a2550;--muted:#b9b3e0}}
:root[data-theme="dark"]{--bg:#1b1735;--ink:#fff4dd;--card:#2a2550;--muted:#b9b3e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
.bub{position:fixed;border-radius:50%;opacity:.35;animation:float 12s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes float{50%{transform:translateY(-40px) scale(1.1)}}
main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:32px 18px 48px}
header{text-align:center;margin-bottom:28px}
h1{font-size:clamp(28px,6vw,46px);margin:8px 0;line-height:1.2}
h1 span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
h1 span:nth-child(2n){animation-delay:.3s}
@keyframes wob{50%{transform:translateY(-6px) rotate(-4deg)}}
header p{color:var(--muted);font-size:17px;margin:0}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:24px;padding:24px 20px;border:4px solid var(--c);box-shadow:0 8px 0 var(--c);transition:transform .2s,box-shadow .2s;position:relative;cursor:pointer}
.card:hover,.card:focus-visible{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 14px 0 var(--c);outline:none}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.ico{font-size:52px;display:block;transition:transform .3s}
.card:hover .ico{transform:scale(1.25) rotate(12deg)}
.tag{display:inline-block;background:var(--c);color:#fff;font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px;margin:10px 0 6px}
.card h2{font-size:20px;margin:4px 0 8px;line-height:1.35}
.card p{margin:0 0 14px;color:var(--muted);font-size:15px;line-height:1.5}
.go{font-weight:800;color:var(--c)}
footer{text-align:center;margin-top:34px;color:var(--muted)}
button{font:inherit;border:0;background:#ff5d8f;color:#fff;font-weight:700;padding:10px 20px;border-radius:99px;cursor:pointer;box-shadow:0 4px 0 #c43a69;margin-top:10px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c43a69}
.conf{position:fixed;width:10px;height:14px;z-index:9;pointer-events:none;animation:fall 1.2s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.pop{position:fixed;border-radius:50%;opacity:.6;z-index:9;pointer-events:none;border:3px solid rgba(255,255,255,.75);box-shadow:inset -6px -6px 12px rgba(255,255,255,.5);animation:fall 2.4s ease-out forwards}
#v{position:fixed;inset:0;background:#000;z-index:50;display:none}#v iframe{width:100%;height:100%;border:0;display:block}#v .x{position:absolute;top:10px;right:10px;margin:0;padding:6px 14px;background:rgba(0,0,0,.55);box-shadow:none;opacity:.5;font-size:14px}#v .x:hover{opacity:1}
@media (max-width:760px){.grid{gap:8px}.card{padding:12px 8px;border-width:3px;border-radius:16px;box-shadow:0 5px 0 var(--c)}.ico{font-size:30px}.card h2{font-size:13px}.card p{display:none}.tag{font-size:11px;padding:2px 8px}.go{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<header>
<div style="font-size:44px" aria-hidden="true">🎈🎓🌈</div>
<h1 id="t"></h1>
<p>點一點卡片，開啟你想看的內容吧！</p>
</header>
<section class="grid">
<a class="card" style="--c:#ff5d8f" target="_blank" rel="noopener" href="https://docs.google.com/presentation/d/1zrt3CoYK89betIex3mIQhljvDdi5HpPc2NWUK8khj9Q/present?slide=id.h5b16e16a03511939_1_469">
<span class="ico">👨‍👩‍👧</span><span class="tag">簡報</span>
<h2>高二家長座談會</h2><p>座談會重點、班級事務與親師溝通一次看。</p><span class="go">出發 →</span></a>
<a class="card" style="--c:#2ab3a6" target="_blank" rel="noopener" href="https://docs.google.com/presentation/d/1Ov7fqqGRKL_lpVLZWu8-zQ3WLW4KhchDwMY07xKI9ks/present?slide=id.p1">
<span class="ico">🎓</span><span class="tag">指南</span>
<h2>畢業條件與成績評量指南</h2><p>桃園陽明高中學生畢業條件與成績評量說明。</p><span class="go">出發 →</span></a>
<a class="card" style="--c:#f5a300" target="_blank" rel="noopener" href="https://docs.google.com/presentation/d/1eJjB670ZhdLchr_3e_63vidxwhQOlR0WwDa2H7Q_JeU/present?slide=id.p1">
<span class="ico">📊</span><span class="tag">分析</span>
<h2>201班與全校成績分析</h2><p>班級與全校成績的比較分析報告。</p><span class="go">出發 →</span></a>
<a class="card" style="--c:#7c5cff" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1XbFgNcUIeCuRWQRGF4jyRXwgDiZuLg1d/preview">
<span class="ico">📸</span><span class="tag">影音</span>
<h2>生活剪影</h2><p>校園日常的精彩瞬間，一起回味！</p><span class="go">出發 →</span></a>
<a class="card" style="--c:#3aa655" target="_blank" rel="noopener" href="https://drive.google.com/file/d/1Bq2VbTqZ0-ZOK1xhzVqgZkKZnBhBIWB6/preview">
<span class="ico">🪑</span><span class="tag">座位表</span>
<h2>座位表</h2><p>班級座位安排，找找自己的位子！</p><span class="go">出發 →</span></a>
</section>
<footer>
<div>想來點驚喜嗎？</div>
<button id="b" type="button">🎉 灑花慶祝</button>
</footer>
</main>
<div id="v"><iframe id="f" allow="fullscreen; autoplay" allowfullscreen title="內容"></iframe><button class="x" id="x" type="button">✕ 返回</button></div>
<script>
var t=document.getElementById('t');
"高二家長座談會".split('').forEach(function(ch){var s=document.createElement('span');s.textContent=ch;t.appendChild(s)});
var cols=['#ff5d8f','#2ab3a6','#f5a300','#7c5cff','#4cc9f0'];
for(var i=0;i<30;i++){var d=document.createElement('div');d.className='bub';var z=30+Math.random()*160;
d.style.cssText='width:'+z+'px;height:'+z+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;background:'+cols[i%5]+';animation-duration:'+(7+Math.random()*9)+'s;animation-delay:'+(-Math.random()*10)+'s';document.body.appendChild(d)}
function burst(x,y){for(var j=0;j<70;j++){var b=document.createElement('div');b.className='pop';var s=20+Math.random()*80;b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(x-s/2)+'px;top:'+(y-s/2)+'px;background:'+cols[j%5]+';';b.style.setProperty('--dx',(Math.random()*(innerWidth+160)-80-x)+'px');b.style.setProperty('--dy',(Math.random()*(innerHeight+160)-80-y)+'px');b.style.animationDuration=(1.8+Math.random()*1.8)+'s';document.body.appendChild(b);setTimeout(function(e){e.remove()},3700,b)}
for(var i=0;i<480;i++){var c=document.createElement('div');c.className='conf';
c.style.left=x+'px';c.style.top=y+'px';c.style.background=cols[i%5];
c.style.setProperty('--dx',(Math.random()*(innerWidth+160)-80-x)+'px');c.style.setProperty('--dy',(Math.random()*(innerHeight+160)-80-y)+'px');c.style.animationDuration=(1.4+Math.random()*1.4)+'s';c.style.transform='scale('+(0.7+Math.random()*0.9)+')';
document.body.appendChild(c);setTimeout(function(e){e.remove()},3000,c)}}
document.getElementById('b').addEventListener('click',function(e){burst(e.clientX,e.clientY)});
var v=document.getElementById('v'),f=document.getElementById('f');
function closeV(){v.style.display='none';f.src='about:blank';if(document.fullscreenElement){document.exitFullscreen().catch(function(){})}}
document.querySelectorAll('.card').forEach(function(a){a.addEventListener('click',function(e){
burst(e.clientX,e.clientY);e.preventDefault();
var u=a.href.replace('/present?slide=','/embed?start=false&loop=false&delayms=3000&slide=');
v.style.display='block';f.src=u;
try{var p=v.requestFullscreen();if(p&&p.catch)p.catch(function(){})}catch(err){}
})});
document.getElementById('x').addEventListener('click',closeV);
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&v.style.display==='block')closeV()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&v.style.display==='block'&&!document.fullscreenElement)closeV()});
</script>
</body>
</html>
