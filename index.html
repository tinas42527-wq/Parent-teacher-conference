<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高二家長座談會｜桃園陽明高中</title>
    <!-- Font Awesome 6 (免費圖示) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans TC', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #e9f0fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* 主卡片入口 */
        .portal-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3rem;
            padding: 2.5rem 2rem 2rem;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 50, 0.25), 
                        0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        /* 標題區 */
        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .header-section h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #1a2e4b;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .header-section h1 i {
            color: #2a6f97;
            font-size: 2.2rem;
            background: rgba(42, 111, 151, 0.12);
            padding: 0.5rem;
            border-radius: 50%;
        }

        .subhead {
            font-size: 1.15rem;
            color: #3d5a73;
            margin-top: 0.75rem;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.8);
            display: inline-block;
            padding: 0.4rem 1.8rem;
            border-radius: 40px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(4px);
        }

        /* 卡片網格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        /* 個別卡片 */
        .portal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.8rem 1.4rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #1f3a4b;
            box-shadow: 0 10px 20px -8px rgba(0, 30, 60, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
            transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #2a6f97, #6a9ec0, #b3d0e6);
            opacity: 0.8;
            transition: height 0.2s;
        }

        .portal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 28px 35px -14px rgba(20, 60, 100, 0.3), 0 0 0 1px rgba(42, 111, 151, 0.3) inset;
            background: white;
        }

        .portal-card:hover::before {
            height: 7px;
            background: linear-gradient(90deg, #1a5a7a, #4a8ab0, #9ac2da);
        }

        /* 卡片圖示 */
        .card-icon {
            font-size: 2.6rem;
            color: #2a6f97;
            background: linear-gradient(135deg, #e3f0fa, #d4e6f5);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            margin-bottom: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 14px -6px rgba(42, 111, 151, 0.2);
        }

        .portal-card:hover .card-icon {
            transform: scale(1.05) rotate(2deg);
            background: linear-gradient(135deg, #d0e6f8, #b8d8f0);
            color: #1a4e6b;
        }

        .portal-card h2 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #1e3a5a;
            margin-bottom: 0.6rem;
            line-height: 1.3;
        }

        .portal-card p {
            font-size: 0.9rem;
            color: #4c6478;
            line-height: 1.5;
            margin-bottom: 0.8rem;
            flex-grow: 1;
        }

        .card-link-hint {
            font-size: 0.8rem;
            color: #2a6f97;
            font-weight: 500;
            background: rgba(42, 111, 151, 0.08);
            padding: 0.35rem 1rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }

        .portal-card:hover .card-link-hint {
            background: rgba(42, 111, 151, 0.2);
            gap: 0.7rem;
        }

        /* 第四張卡片（生活剪影）用不同色調強調 */
        .portal-card.photo-card .card-icon {
            background: linear-gradient(135deg, #f0eaf8, #e2d5f0);
            color: #7b5e9b;
        }

        .portal-card.photo-card::before {
            background: linear-gradient(90deg, #8a6bb0, #b294d4, #d9c5ec);
        }

        .portal-card.photo-card:hover .card-icon {
            background: linear-gradient(135deg, #e6dbf5, #d4c2eb);
            color: #5e3f80;
        }

        .portal-card.photo-card .card-link-hint {
            color: #7b5e9b;
            background: rgba(123, 94, 155, 0.08);
        }

        .portal-card.photo-card:hover .card-link-hint {
            background: rgba(123, 94, 155, 0.2);
        }

        /* 底部提醒 */
        .footer-note {
            text-align: center;
            margin-top: 2.2rem;
            color: #486b84;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.6);
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .footer-note i {
            color: #2a6f97;
        }

        /* 響應式調整 */
        @media (max-width: 650px) {
            body {
                padding: 1.2rem 1rem;
            }

            .portal-container {
                padding: 1.8rem 1.2rem 1.5rem;
                border-radius: 2rem;
            }

            .header-section h1 {
                font-size: 1.9rem;
                gap: 0.5rem;
            }

            .header-section h1 i {
                font-size: 1.7rem;
                padding: 0.4rem;
            }

            .subhead {
                font-size: 1rem;
                padding: 0.3rem 1.2rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 1.4rem;
            }

            .portal-card {
                padding: 1.6rem 1.2rem;
            }

            .card-icon {
                width: 70px;
                height: 70px;
                font-size: 2.2rem;
                border-radius: 24px;
            }

            .footer-note {
                font-size: 0.8rem;
                padding: 0.6rem 1.2rem;
            }
        }

        @media (min-width: 651px) and (max-width: 900px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 增加無障礙焦點樣式 */
        .portal-card:focus-visible {
            outline: 3px solid #2a6f97;
            outline-offset: 4px;
        }

        /* 載入小動畫 */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .portal-card {
            animation: fadeUp 0.5s ease backwards;
        }

        .portal-card:nth-child(1) { animation-delay: 0.05s; }
        .portal-card:nth-child(2) { animation-delay: 0.15s; }
        .portal-card:nth-child(3) { animation-delay: 0.25s; }
        .portal-card:nth-child(4) { animation-delay: 0.35s; }

        /* 自訂小徽章 */
        .badge {
            display: inline-block;
            background: #2a6f97;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.8rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
            background: rgba(42, 111, 151, 0.1);
            color: #1a4e6b;
            border: 1px solid rgba(42, 111, 151, 0.2);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <!-- 標題區 -->
        <div class="header-section">
            <h1>
                <i class="fas fa-chalkboard-user"></i>
                高二家長座談會
                <i class="fas fa-hand-holding-heart"></i>
            </h1>
            <div class="subhead">
                <i class="fas fa-map-pin" style="margin-right: 8px;"></i>桃園陽明高中 · 親師交流入口
            </div>
        </div>

        <!-- 卡片網格：四個入口 -->
        <div class="cards-grid">

            <!-- 卡片 1：高二家長座談會簡報 → 直接播放模式 (present) -->
            <a class="portal-card" 
               href="https://docs.google.com/presentation/d/1zrt3CoYK89betIex3mIQhljvDdi5HpPc2NWUK8khj9Q/present?usp=drive_web&ouid=106643315027302015866" 
               target="_blank" 
               rel="noopener noreferrer">
                <div class="card-icon">
                    <i class="fas fa-users-between-lines"></i>
                </div>
                <h2>高二家長座談會</h2>
                <p>座談會完整簡報，包含校務說明、課程規劃與親師溝通重點。</p>
                <span class="card-link-hint">
                    立即播放 <i class="fas fa-play"></i>
                </span>
                <span class="badge">直接播放</span>
            </a>

            <!-- 卡片 2：學生畢業條件與成績評量指南 → 直接播放模式 (present) -->
            <a class="portal-card" 
               href="https://docs.google.com/presentation/d/1Ov7fqqGRKL_lpVLZWu8-zQ3WLW4KhchDwMY07xKI9ks/present?usp=drive_web&ouid=106643315027302015866" 
               target="_blank" 
               rel="noopener noreferrer">
                <div class="card-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h2>畢業條件與成績評量指南</h2>
                <p>陽明高中畢業門檻、學分計算與成績評量方式完整解析。</p>
                <span class="card-link-hint">
                    立即播放 <i class="fas fa-play"></i>
                </span>
                <span class="badge">直接播放</span>
            </a>

            <!-- 卡片 3：201班成績與全校成績分析報告 → 直接播放模式 (present) -->
            <a class="portal-card" 
               href="https://docs.google.com/presentation/d/1eJjB670ZhdLchr_3e_63vidxwhQOlR0WwDa2H7Q_JeU/present?usp=drive_web&ouid=106643315027302015866" 
               target="_blank" 
               rel="noopener noreferrer">
                <div class="card-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h2>201班成績與全校分析</h2>
                <p>班級成績表現與全年級落點分析，協助了解學習狀況。</p>
                <span class="card-link-hint">
                    立即播放 <i class="fas fa-play"></i>
                </span>
                <span class="badge">直接播放</span>
            </a>

            <!-- 卡片 4：生活剪影 (維持預覽連結) -->
            <a class="portal-card photo-card" 
               href="https://drive.google.com/file/d/1XbFgNcUIeCuRWQRGF4jyRXwgDiZuLg1d/view?usp=sharing" 
               target="_blank" 
               rel="noopener noreferrer">
                <div class="card-icon">
                    <i class="fas fa-camera-retro"></i>
                </div>
                <h2>生活剪影</h2>
                <p>高二生活點滴、活動紀錄與校園花絮，見證孩子的成長。</p>
                <span class="card-link-hint">
                    瀏覽照片 <i class="fas fa-arrow-right"></i>
                </span>
                <span class="badge">活動紀錄</span>
            </a>

        </div>

        <!-- 底部小提醒 -->
        <div class="footer-note">
            <i class="fas fa-link"></i>
            簡報連結已設定為「直接播放」模式，點擊即可全螢幕簡報。
            <i class="fas fa-up-right-from-square" style="opacity: 0.7;"></i>
        </div>
    </div>

    <!-- 小型互動：點擊卡片時console提示 (不影響功能，只是氛圍) -->
    <script>
        (function() {
            // 只是為了讓卡片點擊時有更明顯的反饋（按鈕點擊感）
            const cards = document.querySelectorAll('.portal-card');
            cards.forEach(card => {
                card.addEventListener('click', function(e) {
                    // 如果不想影響預設連結行為，不做 preventDefault
                    // 但可以短暫加入 active 效果
                    this.style.transform = 'scale(0.99)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 120);
                });
                // 鍵盤 accessibility 
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });
            console.log('✅ 高二家長座談會入口已載入，簡報連結已設定為直接播放模式。');
        })();
    </script>

</body>
</html>
